[package]
name = "numhop"
version = "1.2.0"
edition = "2024"
description = "A 3D math platformer for Omarchy"
license = "MIT"
repository = "https://github.com/juancasanueva/omarchy-numhop"

[dependencies]
bevy = { version = "0.20.1", features = ["wav"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
